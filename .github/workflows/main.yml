name: Extract ZIP

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract ZIP
        run: |
          unzip -o free-short-video-studio-public-20clips.zip -d extracted
          cp -r extracted/* .
          rm -rf extracted
          rm -f free-short-video-studio-public-20clips.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Auto extract ZIP" || echo "Nothing to commit"
          git push
