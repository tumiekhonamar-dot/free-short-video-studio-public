name: Move Files to Root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move files from subfolder to root
        run: |
          SRC="free-short-video-studio-main"
          shopt -s dotglob
          mv "$SRC"/* .
          rmdir "$SRC"

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Move files to root" || echo "Nothing to commit"
          git push
